{% set name = "xradarsat2" %}
{% set version = "2025.10.15" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/xradarsat2-{{ version }}.tar.gz
  sha256: d7119a4d5697b984dacf41f9424dc0ac2b5dcc79700c75cfb8673562378e0456

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=64.0
    - setuptools-scm >=7
    - pip
  run:
    - python >={{ python_min }}
    - xmltodict
    - numpy
    - xarray
    - rasterio
    - rioxarray
    - dask-core
    - affine
    - regex
    - pyyaml

test:
  imports:
    - xradarsat2
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/umr-lops/xradarsat2/
  summary: xarray reader for Level-1 SAR radarSat2 products
  license: MIT
  license_file: LICENSE.md
  dev_url: https://github.com/umr-lops/xradarsat2/
  doc_url: https://cerweb.ifremer.fr/datarmor/doc_lib_reader_RS2/html/
extra:
  recipe-maintainers:
    - yreynaud
    - agrouaze
    - vincelhx
    - Skealz
